[package]
name = "reckon-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Harsh Joshi <hi@causality.in>"]
description = "Reckon's laboratory daemon: a local gRPC server for SDKs in other languages"
license = "Apache-2.0"
repository = "https://github.com/getHarshOnline/reckon"

[[bin]]
name = "reckon-daemon"
path = "src/main.rs"

[dependencies]
reckon-kernel = { path = "../kernel" }

# gRPC and protobuf
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Configuration
clap = { version = "4.4", features = ["derive"] }

# Utilities
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v4"] }
parking_lot = "0.12"
dashmap = "5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["test-util"] }

[build-dependencies]
tonic-build = "0.11"
protoc-bin-vendored = "=3.3.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
